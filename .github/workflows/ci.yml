name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Deploys only from main, only after tests pass, and only once the repo has the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (Settings > Secrets >
  # Actions). Token: Cloudflare dashboard > My Profile > API Tokens > "Edit
  # Cloudflare Workers" template. Until both exist this job skips itself.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy-workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.gate.outputs.ready == 'true'
        name: Deploy the three Workers (secrets stay in Cloudflare, never here)
        run: |
          for dir in worker replies vapi; do
            echo "::group::$dir"
            (
              set -e
              cd "$dir"
              if [ -f package-lock.json ]; then npm ci; fi
              npx --yes wrangler@4 deploy
            )
            echo "::endgroup::"
          done
