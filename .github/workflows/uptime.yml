# Checks api.ambuilder.ca every 5 minutes from GitHub's servers — outside
# Adrian's house, so it still works when the house network is the thing that's
# down — and texts him when it goes down and again when it comes back.
#
# Texts only on a change of state, never every 5 minutes. The last known state
# rides between runs in the Actions cache (a new entry per run; restore picks
# the newest), so there's nothing to commit and no repo write access needed.

name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Send a test text to check alerts reach your phone"
        type: boolean
        default: false

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check and alert
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          TEST_SMS: ${{ inputs.test_sms }}
        run: |
          set -u
          mkdir -p state
          text() {
            curl -s -o /dev/null -w "twilio %{http_code}\n" \
              -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" \
              "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
              --data-urlencode "To=$ALERT_PHONE" \
              --data-urlencode "MessagingServiceSid=$TWILIO_MESSAGING_SERVICE_SID" \
              --data-urlencode "Body=$1"
          }

          if [ "$TEST_SMS" = "true" ]; then
            text "AM Builder uptime alerts are set up. You'll get a text if api.ambuilder.ca goes down, and another when it's back."
          fi

          # Three tries over ~40 seconds, so one dropped request isn't an outage.
          now="up"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" https://api.ambuilder.ca/health || echo 000)
            echo "try $i: $code"
            [ "$code" = "200" ] && { now="up"; break; }
            now="down"
            [ $i -lt 3 ] && sleep 20
          done

          was=$(cat state/status 2>/dev/null || echo up)
          since=$(cat state/since 2>/dev/null || date -u +%s)
          echo "was=$was now=$now"
          stamp=$(TZ=America/Edmonton date +"%-I:%M %p")

          if [ "$was" = "up" ] && [ "$now" = "down" ]; then
            text "ALERT: api.ambuilder.ca is DOWN (last answer: $code) as of $stamp. Dashboard, demos, call recaps and text replies are offline. Usually the server's network: check the cable and power."
            since=$(date -u +%s)
          elif [ "$was" = "down" ] && [ "$now" = "up" ]; then
            mins=$(( ( $(date -u +%s) - since ) / 60 ))
            text "OK: api.ambuilder.ca is back up as of $stamp, after about $mins min down."
            since=$(date -u +%s)
          fi
          echo "$now" > state/status
          echo "$since" > state/since

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
