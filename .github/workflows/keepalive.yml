# GitHub switches off scheduled workflows in a repo with no commits for 60
# days. This commits a date stamp once a month so the uptime check never
# silently stops.
name: keepalive

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep the uptime schedule alive" || true
          git push
